    function useVoiceCapture() {
      const [listening, setListening] = useState(false);
      const [liveTranscript, setLiveTranscript] = useState("");
      const [error, setError] = useState(null);

      const recognitionRef = useRef(null);
      const finalTranscriptRef = useRef("");
      const shouldListenRef = useRef(false);

      const buildRecognition = useCallback(() => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return null;
        const rec = new SpeechRecognition();
        rec.continuous = true;
        rec.interimResults = true;
        rec.lang = "en-US";

        rec.onresult = (event) => {
          let interim = "";
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const transcript = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
              finalTranscriptRef.current += transcript + " ";
            } else {
              interim += transcript;
            }
          }
          setLiveTranscript(finalTranscriptRef.current + interim);
        };

        rec.onerror = (e) => {
          if (e.error !== "no-speech") {
            setError("Mic issue (" + e.error + ")");
          }
        };

        rec.onend = () => {
          if (shouldListenRef.current) {
            try { rec.start(); } catch (_) {}
          } else {
            setListening(false);
          }
        };

        return rec;
      }, []);

      const start = useCallback(() => {
        setError(null);
        const rec = buildRecognition();
        if (!rec) {
          setError("Voice dictation is not available in this browser.");
          return;
        }
        finalTranscriptRef.current = "";
        setLiveTranscript("");
        recognitionRef.current = rec;
        shouldListenRef.current = true;
        rec.start();
        setListening(true);
      }, [buildRecognition]);

      const stop = useCallback(() => {
        shouldListenRef.current = false;
        if (recognitionRef.current) {
          recognitionRef.current.stop();
        }
        setListening(false);
        const dump = finalTranscriptRef.current.trim();
        setLiveTranscript("");
        return dump;
      }, []);

      return { listening, liveTranscript, error, start, stop };
    }

    function BrainDump() {
      const [tab, setTab] = useState("tasks");

      const taskVoice = useVoiceCapture();

      // Load Saved State[span_5](start_span)[span_5](end_span)
      useEffect(() => {
        (async () => {

      }, []);

      const isAchievementUnlocked = (achId) => {
        switch (achId) {
          case "tier_1": return tasksCompleted >= 1 || tasks.some(t => t.done);
          case "tier_2": return notesSaved >= 1 || notes.length > 0;
          case "tier_3": return tasks.filter(t => t.category === "cleaning" && t.done).length >= 3;
          case "tier_4": return tasks.filter(t => t.category === "health" && t.done).length >= 3;
          case "tier_5": return tasksCompleted >= 5;
          case "tier_6": return tasks.filter(t => t.category === "creative" && t.done).length >= 3;
          case "tier_7": return tasks.filter(t => t.category === "work" && t.done).length >= 3;
          case "tier_8": return tasks.filter(t => t.category === "social" && t.done).length >= 3;
          case "tier_9": return tasks.some(t => t.dateKey !== formatDateKey(new Date()));
          case "tier_10": return tasksCompleted >= 10;
          case "tier_11": return notesSaved >= 3;
          case "tier_12": return tasks.length > 0 && tasks.filter(t => t.bucket === "today" && !t.done).length === 0;
          case "tier_13": return tasks.length >= 5;
          case "tier_14": return pets >= 10;
          case "tier_15": return Object.keys(daycare).length >= 2;
          case "tier_16": return tokens >= 25;
          case "tier_17": return tasks.filter(t => t.bucket === "week").length >= 5;
          case "tier_18": return tasks.filter(t => t.bucket === "someday").length >= 5;
          case "tier_19": return tasksCompleted >= 25;
          case "tier_20": return tasksCompleted >= 30;
          case "tier_21": return Object.values(inventory).some(v => v > 0);
          case "tier_22": return Object.values(companionData).some(pts => pts >= 70);
          case "tier_23": return notesSaved >= 10;
          case "tier_24": return ["cleaning", "health", "work"].every(cat => tasks.some(t => t.category === cat && t.done));
          case "tier_25": return Object.keys(daycare).length > 0;
          case "tier_26": return tokens >= 75;
          case "tier_27": return inventory.xp_potion === 0;
          case "tier_28": return new Set(tasks.map(t => t.dateKey)).size >= 5;
          case "tier_29": return tasksCompleted >= 50;
          case "tier_30": return tasksCompleted >= 75;
          default: return false;
        }
      };

      const earnedAwardsCount = ACHIEVEMENTS.filter(a => isAchievementUnlocked(a.id)).length;
      const isSpeciesUnlocked = (sp) => !sp.unlockReq || isAchievementUnlocked(sp.unlockReq);
      const maxDaycareSlots = isAchievementUnlocked("tier_5") ? 3 : 2;
      const inventoryUnlocked = isAchievementUnlocked("tier_30");

      const phoenixUnlocked = isSpeciesUnlocked(SPECIES.find((s) => s.id === "phoenix"));
      const phoenixPoints = companionData["phoenix"] || 0;
      const phoenixStage = phoenixUnlocked ? stageIndexFor(phoenixPoints) : -1;
      const phoenixBoostPercent = phoenixUnlocked ? phoenixStage + 1 : 0;
      const charmBonus = (inventory.aura_charm || 0) * 5;

      const applyXpBoost = (amount) => {
        const totalMultiplier = 1 + (phoenixBoostPercent + charmBonus) / 100;
        return amount * totalMultiplier;
      };

      // Passive Daycare timer
      useEffect(() => {
        const timer = setInterval(() => {
          const current = Date.now();
          setNowTime(current);
          setDaycare((prevDaycare) => {
            if (Object.keys(prevDaycare).length === 0) return prevDaycare;
            const updatedDaycare = { ...prevDaycare };
            setCompanionData((prevData) => {
              const nextData = { ...prevData };
              Object.entries(updatedDaycare).forEach(([spId, startTime]) => {
                const minutesElapsed = Math.floor((current - startTime) / 60000);
                if (minutesElapsed > 0) {
                  const boostedEarned = applyXpBoost(minutesElapsed);
                  const oldPoints = nextData[spId] || 0;
                  let newPoints = oldPoints + boostedEarned;
                  if (newPoints > MAX_POINTS) newPoints = MAX_POINTS;
                  registerLevelUps(spId, oldPoints, newPoints, true);
                  nextData[spId] = newPoints;
                  updatedDaycare[spId] = startTime + minutesElapsed * 60000;
                }
              });
              return nextData;
            });
            return updatedDaycare;
          });
        }, 10000);
        return () => clearInterval(timer);
      }, [phoenixUnlocked, phoenixBoostPercent, charmBonus]);

      useEffect(() => { if (loaded) window.storage.set(TASKS_KEY, JSON.stringify(tasks)); }, [tasks, loaded]);
      useEffect(() => { if (loaded) window.storage.set(NOTES_KEY, JSON.stringify(notes)); }, [notes, loaded]);
      useEffect(() => { if (loaded) window.storage.set(STATS_KEY, JSON.stringify({ tasksCompleted, notesSaved, pets, petGate })); }, [tasksCompleted, notesSaved, pets, petGate, loaded]);
      useEffect(() => { if (loaded) window.storage.set(COMPANION_KEY, JSON.stringify({ data: companionData, active: activeSpecies })); }, [companionData, activeSpecies, loaded]);
      useEffect(() => { if (loaded) window.storage.set(DAYCARE_KEY, JSON.stringify(daycare)); }, [daycare, loaded]);
      useEffect(() => { if (loaded) window.storage.set(INVENTORY_KEY, JSON.stringify(inventory)); }, [inventory, loaded]);
      useEffect(() => { if (loaded) window.storage.set(TOKENS_KEY, JSON.stringify(tokens)); }, [tokens, loaded]);
      useEffect(() => { if (loaded) window.storage.set(LEVEL_MILESTONES_KEY, JSON.stringify(levelMilestones)); }, [levelMilestones, loaded]);

      const dismissPopup = () => setPopupQueue((q) => q.slice(1));

      // Checks whether newPoints crossed any level-milestone (every 10 levels, plus max level 100)
      // relative to oldPoints, and queues a popup (and an alert if maxed while in Daycare).
      const registerLevelUps = (speciesId, oldPoints, newPoints, wasInDaycare) => {
        const oldLevel = levelForPoints(oldPoints);
        const newLevel = levelForPoints(newPoints);
        if (newLevel <= oldLevel) return;

        const crossed = [];
        for (let m = 5; m <= LEVEL_CAP; m += 5) {
          if (oldLevel < m && newLevel >= m) crossed.push(m);
        }
        if (crossed.length === 0) return;

        setLevelMilestones((prev) => {
          const already = prev[speciesId] || [];
          const toShow = crossed.filter((m) => !already.includes(m));
          if (toShow.length === 0) return prev;

          const sp = SPECIES.find((s) => s.id === speciesId);
          const petLabel = sp ? `${sp.emoji} ${sp.label}` : "Your companion";

            ...toShow.map((m) => ({ speciesId, level: m, isMax: m === LEVEL_CAP, wasInDaycare, flavor: flavorForLevel(m) })),

          return { ...prev, [speciesId]: [...already, ...toShow] };

      // --- NEW FEATURE: Markdown Export Function ---

        setNotes((prev) => [

      const processTranscript = (dump) => {
        setProcessing(true);
        try {
          const rawItems = dump
            .split(/(?:\.|\n|\b(?:and then|also|next|plus)\b)+/i)
            .map((s) => s.trim())
            .filter((s) => s.length > 2);

          const todayKey = formatDateKey(new Date());
          const newTasks = rawItems.map((text) => {
            const lower = text.toLowerCase();
            let bucket = "today";
            if (lower.includes("someday") || lower.includes("eventually") || lower.includes("later")) {
              bucket = "someday";
            } else if (lower.includes("this week") || lower.includes("weekend") || lower.includes("next few days")) {
              bucket = "week";
            }

            let category = "other";
            if (/clean|wash|tidy|laundry|dishes|trash|vacuum/.test(lower)) category = "cleaning";
            else if (/doctor|exercise|workout|meds|health|walk|water/.test(lower)) category = "health";
            else if (/write|draw|design|idea|create|code|build/.test(lower)) category = "creative";
            else if (/email|report|meeting|work|file|study/i.test(lower)) category = "work";
            else if (/call|buy|grocery|store|meet|pick up|errand/.test(lower)) category = "social";

            return {
              id: Math.random().toString(),
              text: text.charAt(0).toUpperCase() + text.slice(1),
              bucket,
              category,
              dateKey: todayKey,
              done: false,
              createdAt: Date.now(),
            };
          });

          if (newTasks.length > 0) {
            setTasks((prev) => [...newTasks, ...prev]);

        } catch (e) {
          setTaskError("Failed to parse transcript locally.");
        } finally {
          setProcessing(false);
        }
      };

      const toggleDone = (id) => {

          const beneficiary = cat.affinity || activeSpecies;
          const rawAmount = cat.affinity ? BONUS_TASK_XP : BASE_TASK_XP;
          const amount = applyXpBoost(rawAmount);

          addXpToSpecies(beneficiary, amount, !!daycare[beneficiary]);
          setTasksCompleted((c) => c + 1);
          setTokens((t) => t + 5);

          const fedCompanion = SPECIES.find(s => s.id === beneficiary);

            setLastFedInfo({ name: fedCompanion.label, emoji: fedCompanion.emoji, amount: Number(amount.toFixed(1)) });
            setTimeout(() => setLastFedInfo(null), 3500);

          const remainingPending = tasks.filter((t) => t.id !== id && !t.done).length;

            const clearBonus = applyXpBoost(2);
            setCompanionData((prev) => {

              SPECIES.forEach((s) => {
                if (isSpeciesUnlocked(s)) {

              });
              return updated;

            setTimeout(() => {
              setLastFedInfo({ name: "All Pets (All Tasks Cleared Bonus)", emoji: "🎉", amount: Number((clearBonus * 5).toFixed(1)) });
              setTimeout(() => setLastFedInfo(null), 4000);
            }, 3600);
          }
        }
        setTasks((prev) => prev.map((t) => (t.id === id ? { ...t, done: !t.done } : t)));
      };

      const changeTaskCategory = (id, newCat) => {
        setTasks((prev) => prev.map((t) => (t.id === id ? { ...t, category: newCat } : t)));
      };

      const deleteTask = (id) => setTasks((prev) => prev.filter((t) => t.id !== id));
      const deleteNote = (id) => setNotes((prev) => prev.filter((n) => n.id !== id));

      const addCalendarTask = () => {

                </button>
              </div>

              {noteVoice.liveTranscript && <div style={{ marginTop: 12, maxWidth: 420, width: "100%", fontSize: 13, color: "#B7B9C4", fontStyle: "italic", padding: "10px 14px", borderLeft: "2px solid #7FA88F", background: "rgba(255,255,255,0.03)", borderRadius: 6 }}>{noteVoice.liveTranscript}</div>}

              <div style={{ marginTop: 28, width: "100%", maxWidth: 580, display: "flex", flexDirection: "column", gap: 10 }}>
                {filteredNotes.map((n) => (
                  <div key={n.id} className="bd-task" style={{ padding: "12px 14px", borderRadius: 10, background: "rgba(255,255,255,0.04)", borderLeft: "2px solid #7FA88F" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4, alignItems: "center" }}>
                      <span style={{ fontSize: 11, color: "#6E7080" }}>{fmtDate(n.createdAt)}</span>
                      <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                        <button onClick={() => exportSingleNote(n)} title="Export Transcription as .txt" style={{ background: "none", border: "none", cursor: "pointer", display: "flex", alignItems: "center" }}>
                          <Download size={13} color="#7FA88F" />
                        </button>
                        <button onClick={() => deleteNote(n.id)} style={{ background: "none", border: "none", cursor: "pointer" }}>
                          <Trash2 size={13} color="#6E7080" />
                        </button>
                      </div>
                    </div>
                    <p style={{ margin: 0, fontSize: 13, color: "#E8E6E1", whiteSpace: "pre-wrap" }}>{n.text}</p>
                  </div>
                ))}
              </div>
            </>
          )}

          {/* COMPANIONS TAB */}
          {tab === "companion" && (
            <div style={{ width: "100%", maxWidth: 540, marginTop: 16, display: "flex", flexDirection: "column", gap: 14 }}>
              <p style={{ fontSize: 12, color: "#8B8D99", textAlign: "center", margin: "0 0 4px" }}>
                Unlock mythical companions by leveling up your <strong>Award Tiers</strong> (Phoenix at Tier 10, Turtle at Tier 20, Dragon at Tier 30)!
              </p>

              {SPECIES.map((sp) => {
                const unlocked = isSpeciesUnlocked(sp);
                const pts = Number((companionData[sp.id] || 0).toFixed(1));
                const stage = stageIndexFor(pts);
                const currentEmoji = sp.emojis[stage];
                const inDaycare = !!daycare[sp.id];
                const currentStageBoost = sp.id === "phoenix" ? stage + 1 : 0;

                return (
                  <div key={sp.id} style={{ padding: "14px 16px", borderRadius: 12, background: unlocked ? "rgba(255,255,255,0.03)" : "rgba(255,255,255,0.01)", border: `1px solid ${unlocked ? sp.color + "33" : "rgba(255,255,255,0.08)"}`, opacity: unlocked ? 1 : 0.6, display: "flex", alignItems: "center", gap: 14, position: "relative" }}>
                    <div style={{ width: 56, height: 56, borderRadius: "50%", background: unlocked ? `${sp.color}1F` : "rgba(255,255,255,0.05)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: unlocked ? STAGE_SIZES[stage] * 0.5 : 22, flexShrink: 0 }}>
                      {unlocked ? currentEmoji : <Lock size={22} color="#6E7080" />}
                    </div>

                    <div style={{ flex: 1 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                        <span style={{ fontWeight: 700, fontSize: 14, color: unlocked ? sp.color : "#8B8D99" }}>{sp.label}</span>
                        {inDaycare && <span style={{ fontSize: 10, background: "rgba(229,112,126,0.2)", color: "#E5707E", padding: "2px 6px", borderRadius: 10, fontWeight: 600 }}>🏨 Daycare</span>}
                        {!sp.canDaycare && unlocked && <span style={{ fontSize: 10, background: "rgba(255,215,0,0.15)", color: "#FFD700", padding: "2px 6px", borderRadius: 10, fontWeight: 600 }}>👑 Legendary</span>}
                      </div>

                      {unlocked ? (
                        <>
                          <div style={{ fontSize: 11, color: "#B7B9C4", marginTop: 2 }}>
                            Level {levelForPoints(pts)}/{LEVEL_CAP} • Stage {stage + 1}/5 ({pts} XP) • {sp.id === "phoenix" ? `Provides +${currentStageBoost}% Boost` : `Likes: ${sp.catLabel}`}
                          </div>
                          {(() => {
                            const lvl = levelForPoints(pts);
                            const withinLevel = pts - (lvl - 1) * XP_PER_LEVEL;
                            const pct = lvl >= LEVEL_CAP ? 100 : Math.min(100, (withinLevel / XP_PER_LEVEL) * 100);
                            return (
                              <div style={{ marginTop: 4, height: 4, borderRadius: 2, background: "rgba(255,255,255,0.08)", overflow: "hidden" }}>
                                <div style={{ width: `${pct}%`, height: "100%", background: sp.color, transition: "width 0.3s ease" }} />
                              </div>
                            );
                          })()}
                          <div style={{ fontSize: 10, color: "#6E7080", marginTop: 4 }}>
                            {sp.desc} {!sp.canDaycare && "(Cannot be put in daycare)"}
                          </div>
                        </>
                      ) : (
                        <div style={{ fontSize: 11, color: "#E5707E", marginTop: 4 }}>
                          🔒 Unlocks with: <strong>{sp.unlockAward}</strong>
                        </div>
                      )}
                    </div>

                    {unlocked ? (
                      <div style={{ display: "flex", gap: 6 }}>
                        <button onClick={() => petCompanion(sp.id)} style={{ background: `${sp.color}2E`, border: "none", color: sp.color, padding: "6px 10px", borderRadius: 8, fontSize: 11, fontWeight: 600, cursor: "pointer" }}>
                          Pet 💕
                        </button>
                        {sp.canDaycare ? (
                          <button onClick={() => toggleDaycare(sp.id)} style={{ background: inDaycare ? "rgba(229,112,126,0.2)" : "rgba(255,255,255,0.06)", border: "none", color: inDaycare ? "#E5707E" : "#B7B9C4", padding: "6px 10px", borderRadius: 8, fontSize: 11, fontWeight: 600, cursor: "pointer" }}>
                            {inDaycare ? "Leave" : "Daycare 🏨"}
                          </button>
                        ) : (
                          <span style={{ fontSize: 10, color: "#6E7080", padding: "6px 0", alignSelf: "center" }}>No Daycare</span>
                        )}
                      </div>
                    ) : (
                      <button onClick={() => setTab("achievements")} style={{ background: "rgba(255,255,255,0.06)", border: "none", color: "#B7B9C4", padding: "6px 10px", borderRadius: 8, fontSize: 11, cursor: "pointer" }}>
                        View Tier
                      </button>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          {/* DAYCARE TAB */}
          {tab === "daycare" && (
            <div style={{ width: "100%", maxWidth: 540, marginTop: 16, display: "flex", flexDirection: "column", gap: 16 }}>
              <div style={{ background: "linear-gradient(135deg, rgba(229,112,126,0.15), rgba(242,166,90,0.15))", borderRadius: 12, padding: "16px", border: "1px solid rgba(229,112,126,0.3)", textAlign: "center" }}>
                <h3 style={{ margin: "0 0 6px", fontSize: 16, color: "#E5707E" }}>🏨 Daycare Nursery</h3>
                <p style={{ margin: 0, fontSize: 12, color: "#B7B9C4", lineHeight: 1.4 }}>
                  Companions checked into Daycare passively earn <strong>+{applyXpBoost(1).toFixed(2)} XP every minute</strong>!
                </p>
                {isAchievementUnlocked("tier_5") ? (
                  <span style={{ display: "inline-block", marginTop: 8, fontSize: 11, background: "rgba(127,168,143,0.2)", border: "1px solid rgba(127,168,143,0.4)", color: "#7FA88F", padding: "2px 8px", borderRadius: 10, fontWeight: 700 }}>
                    🎉 Tier 5 Master Keeper Unlocked: Expanded to 3 Slots!
                  </span>
                ) : (
                  <span style={{ display: "inline-block", marginTop: 8, fontSize: 11, color: "#8B8D99" }}>
                    🔒 Reach Tier 5 Award Milestone to unlock the 3rd Daycare Slot!
                  </span>
                )}
              </div>

              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <h4 style={{ margin: "4px 0 0", fontSize: 13, color: "#8B8D99" }}>
                  Currently Resting ({Object.keys(daycare).length} / {maxDaycareSlots} Slots):
                </h4>

                {Object.keys(daycare).length === 0 ? (
                  <div style={{ padding: "24px", borderRadius: 12, border: "1px dashed rgba(255,255,255,0.1)", textAlign: "center", color: "#6E7080", fontSize: 13 }}>
                    No companions in daycare. Check one in below!
                  </div>
                ) : (
                  Object.entries(daycare).map(([spId, startTime]) => {
                    const sp = SPECIES.find((s) => s.id === spId);
                    if (!sp) return null;
                    const pts = Number((companionData[sp.id] || 0).toFixed(1));
                    const stage = stageIndexFor(pts);
                    const elapsedMins = Math.floor((nowTime - startTime) / 60000);
                    const earnedXp = Number((applyXpBoost(elapsedMins)).toFixed(1));

                    return (
                      <div key={sp.id} style={{ padding: "14px 16px", borderRadius: 12, background: "rgba(229,112,126,0.08)", border: "1px solid rgba(229,112,126,0.25)", display: "flex", alignItems: "center", gap: 14 }}>
                        <div style={{ width: 48, height: 48, borderRadius: "50%", background: `${sp.color}2E`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: STAGE_SIZES[stage] * 0.45 }}>
                          {sp.emojis[stage]}
                        </div>
                        <div style={{ flex: 1 }}>
                          <div style={{ fontWeight: 700, fontSize: 14, color: sp.color }}>{sp.label}</div>
                          <div style={{ fontSize: 12, color: "#B7B9C4", marginTop: 2 }}>
                            Level {levelForPoints(pts)}/{LEVEL_CAP} • Resting for: <strong>{elapsedMins}m</strong> (+{earnedXp} XP earned)
                          </div>
                        </div>
                        <button onClick={() => toggleDaycare(sp.id)} style={{ background: "rgba(255,255,255,0.08)", border: "none", color: "#E8E6E1", padding: "6px 12px", borderRadius: 8, fontSize: 12, cursor: "pointer", fontWeight: 600 }}>
                          Check Out
                        </button>
                      </div>
                    );
                  })
                )}
              </div>

              <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 8 }}>
                <h4 style={{ margin: "4px 0 0", fontSize: 13, color: "#8B8D99" }}>Eligible Companions:</h4>
                {SPECIES.filter((sp) => sp.canDaycare && isSpeciesUnlocked(sp) && !daycare[sp.id]).map((sp) => {
                  const pts = companionData[sp.id] || 0;
                  const stage = stageIndexFor(pts);
                  const isFull = Object.keys(daycare).length >= maxDaycareSlots;

                  return (
                    <div key={sp.id} style={{ padding: "10px 14px", borderRadius: 10, background: "rgba(255,255,255,0.03)", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                        <span style={{ fontSize: 20 }}>{sp.emojis[stage]}</span>
                        <span style={{ fontSize: 13, fontWeight: 600, color: sp.color }}>{sp.label}</span>
                      </div>
                      <button onClick={() => toggleDaycare(sp.id)} disabled={isFull} style={{ background: isFull ? "rgba(255,255,255,0.03)" : `${sp.color}2E`, border: "none", color: isFull ? "#6E7080" : sp.color, padding: "5px 10px", borderRadius: 6, fontSize: 11, fontWeight: 600, cursor: isFull ? "not-allowed" : "pointer" }}>
                        {isFull ? "Daycare Full" : "Check In"}
                      </button>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* INVENTORY & SHOP TAB */}
          {tab === "inventory" && (
            <div style={{ width: "100%", maxWidth: 540, marginTop: 16, display: "flex", flexDirection: "column", gap: 16 }}>
              {!inventoryUnlocked ? (
                <div style={{ padding: "32px 20px", borderRadius: 16, background: "rgba(255,255,255,0.02)", border: "1px dashed rgba(255,255,255,0.1)", textAlign: "center", color: "#8B8D99" }}>
                  <Lock size={32} color="#E5707E" style={{ marginBottom: 12 }} />
                  <h3 style={{ margin: "0 0 6px", color: "#E8E6E1" }}>Inventory & Item Shop Locked</h3>
                  <p style={{ margin: 0, fontSize: 13 }}>Complete tasks to reach <strong>Tier 30</strong> (Celestial Dragon Award Tier) to unlock your inventory, item shop, and Celestial Dragon!</p>
                  <p style={{ fontSize: 12, color: "#F2A65A", marginTop: 8, fontWeight: 600 }}>Current Unlocked Tiers: {earnedAwardsCount} / 30</p>
                </div>
              ) : (
                <>
                  <div style={{ background: "rgba(0,245,212,0.05)", border: "1px solid rgba(0,245,212,0.2)", borderRadius: 12, padding: "16px" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                      <h3 style={{ margin: 0, fontSize: 15, color: "#00F5D4" }}>🛍️ Task Token Shop</h3>
                      <span style={{ fontSize: 12, fontWeight: 700, color: "#F2A65A" }}>🪙 {tokens} Tokens</span>
                    </div>

                    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                      {SHOP_ITEMS.map((item) => (
                        <div key={item.id} style={{ padding: "10px 12px", background: "rgba(0,0,0,0.2)", borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                          <div>
                            <div style={{ fontWeight: 600, fontSize: 13, color: "#E8E6E1" }}>{item.name}</div>
                            <div style={{ fontSize: 11, color: "#8B8D99", marginTop: 2 }}>{item.desc}</div>
                          </div>
                          <button onClick={() => buyShopItem(item)} disabled={tokens < item.cost} style={{ background: tokens >= item.cost ? "#00F5D4" : "rgba(255,255,255,0.05)", border: "none", color: tokens >= item.cost ? "#14161F" : "#6E7080", padding: "6px 10px", borderRadius: 6, fontSize: 11, fontWeight: 700, cursor: tokens >= item.cost ? "pointer" : "not-allowed" }}>
                            Buy ({item.cost} 🪙)
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div style={{ background: "rgba(255,255,255,0.03)", borderRadius: 12, padding: "16px", border: "1px solid rgba(255,255,255,0.06)" }}>
                    <h3 style={{ margin: "0 0 12px", fontSize: 15, color: "#F7C978" }}>🎒 Your Backpack</h3>

                    <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
                      <span style={{ fontSize: 12, color: "#8B8D99" }}>Target Companion:</span>
                      <select value={itemTargetPet} onChange={(e) => setItemTargetPet(e.target.value)} style={{ background: "rgba(255,255,255,0.06)", border: "none", color: "#fff", padding: "4px 8px", borderRadius: 6, fontSize: 12 }}>
                        {SPECIES.filter(sp => isSpeciesUnlocked(sp)).map((sp) => (
                          <option key={sp.id} value={sp.id} style={{ background: "#14161F" }}>{sp.emoji} {sp.label}</option>
                        ))}
                      </select>
                    </div>

                    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                      {SHOP_ITEMS.map((item) => {
                        const qty = inventory[item.id] || 0;
                        return (
                          <div key={item.id} style={{ padding: "8px 12px", borderRadius: 8, background: "rgba(255,255,255,0.02)", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                            <span style={{ fontSize: 13 }}>{item.name} <strong>x{qty}</strong></span>
                            {item.type === "consumable" ? (
                              <button onClick={() => useInventoryItem(item.id)} disabled={qty <= 0} style={{ background: qty > 0 ? "#F7C978" : "rgba(255,255,255,0.05)", border: "none", color: qty > 0 ? "#14161F" : "#6E7080", padding: "5px 10px", borderRadius: 6, fontSize: 11, fontWeight: 700, cursor: qty > 0 ? "pointer" : "not-allowed" }}>
                                Use Item
                              </button>
                            ) : (
                              <span style={{ fontSize: 11, color: "#7FA88F", fontWeight: 600 }}>Active Boost (+{qty * 5}%)</span>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </>
              )}
            </div>
          )}

          {/* AWARDS TAB */}
          {tab === "achievements" && (
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", width: "100%", maxWidth: 520, marginTop: 20, gap: 12 }}>
              <div style={{ textAlign: "center", marginBottom: 8 }}>
                <span style={{ fontSize: 13, color: "#D9A8E5", fontWeight: 700 }}>
                  🏆 Unlocked Milestones: {earnedAwardsCount} / 30 Tiers
                </span>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, width: "100%", maxHeight: "60vh", overflowY: "auto", paddingRight: 4 }}>
                {ACHIEVEMENTS.map((a) => {
                  const done = isAchievementUnlocked(a.id);
                  return (
                    <div key={a.id} style={{ padding: "12px 14px", borderRadius: 10, background: done ? "rgba(217,168,229,0.1)" : "rgba(255,255,255,0.03)", border: done ? "1px solid rgba(217,168,229,0.35)" : "none", opacity: done ? 1 : 0.5 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                        {done ? <Trophy size={14} color="#D9A8E5" /> : <Lock size={12} color="#6E7080" />}
                        <span style={{ fontSize: 12, fontWeight: 600 }}>{a.label}</span>
                      </div>
                      <p style={{ margin: "4px 0 0", fontSize: 11, color: "#6E7080" }}>{a.desc}</p>
                      {a.unlocks && (
                        <div style={{ marginTop: 6, fontSize: 10, fontWeight: 700, color: done ? "#7FA88F" : "#F2A65A", display: "flex", alignItems: "center", gap: 4 }}>
                          🎁 {a.unlocks}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<BrainDump />);
  </script>
</body>
</html>
